packages:
  - examples/**
  - docs
  - client
catalog:
  nuxt: ^4.4.4
  vite: 'https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-core@1738'
  vite-plugin-inspect: ^11.3.3
  vite-plus: 'https://pkg.pr.new/voidzero-dev/vite-plus@1738'
  vitest: 'https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-test@1738'

ignoreWorkspaceRootCheck: true
overrides:
  vitest: 'catalog:'
minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - vite-plus
  - vite
  - vitest
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - '@oxlint/*'
  - oxlint
  - oxfmt
  - oxlint-tsgolint
blockExoticSubdeps: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
shamefullyHoist: true
onlyBuiltDependencies:
  - esbuild
  - '@sveltejs/kit'
  - sharp
  - vue-demi
  - svelte-preprocess
