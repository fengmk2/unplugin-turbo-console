minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'
  - '@rolldown/*'
  - '@tsdown/*'
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - tsdown
  - rolldown
packages:
  - examples/**
  - docs
  - client
catalog:
  nuxt: ^4.4.4
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.1d7ba811f0e456640b0e761e8e8acf77d1ad3251
  vite-plugin-inspect: ^11.3.3
  vite-plus: 0.0.0-commit.1d7ba811f0e456640b0e761e8e8acf77d1ad3251
  vitest: 4.1.9
  '@vitest/ui': 4.1.9

ignoreWorkspaceRootCheck: true
overrides:
  vitest: 'catalog:'
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
shamefullyHoist: true
onlyBuiltDependencies:
  - esbuild
  - '@sveltejs/kit'
  - sharp
  - vue-demi
  - svelte-preprocess
